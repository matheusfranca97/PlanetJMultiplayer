<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Unity Web Player | PlanetJ</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* ocupa a tela inteira e centraliza o canvas */
      #unity-container {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
      }

      /* o tamanho será controlado por JS para manter 16:9 */
      #unity-canvas {
        background: #231F20;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/PlanetJMultiplayer.loader.js"></script>
    <script>
      // viewport só para mobile, como no seu código
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      // Mantém 16:9, sem esticar, e força o canvas a ter tamanho "real"
      const ASPECT = 16 / 9;
      const container = document.getElementById('unity-container');
      const canvas = document.getElementById('unity-canvas');

      function resizeCanvas() {
        const cw = container.clientWidth;
        const ch = container.clientHeight;

        // calcula o maior retângulo 16:9 que cabe na tela
        let w = cw;
        let h = Math.round(w / ASPECT);
        if (h > ch) {
          h = ch;
          w = Math.round(h * ASPECT);
        }

        // aplica tamanho CSS do canvas
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';

        // Em alguns casos (mudança de monitor/escala), o DPR muda.
        // Força uma reavaliação do Unity casando o buffer com o client size.
        // O Unity casa automaticamente quando detecta mudança de clientWidth/Height,
        // então não é necessário chamar nada extra aqui.
      }

      // Reage a redimensionamentos, rotação e mudança de DPR entre monitores
      window.addEventListener('resize', resizeCanvas);
      window.addEventListener('orientationchange', resizeCanvas);
      // Detecta mudanças de DPR (ex.: mover entre monitores com escalas diferentes)
      matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener('change', resizeCanvas);

      // Primeiro ajuste antes de inicializar
      resizeCanvas();

      // Inicialização do Unity inalterada; apenas definimos devicePixelRatio de forma segura
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/PlanetJMultiplayer.data",
        frameworkUrl: "Build/PlanetJMultiplayer.framework.js",
        codeUrl: "Build/PlanetJMultiplayer.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "PlanetJ",
        productVersion: "0.1.0",
        // Limita DPR para evitar buffers gigantes e instabilidade ao trocar de monitor
        devicePixelRatio: Math.min(2, window.devicePixelRatio || 1)
      }).then(() => {
        // garante o canvas ajustado após o boot
        resizeCanvas();
      });
    </script>
  </body>
</html>
